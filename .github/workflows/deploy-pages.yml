# =====================================================================
# Dr.Coach! — Deploy automático a GitHub Pages
# -------------------------------------------------------------------------
# Cada push a main publica la PWA (sitio 100 % estático en la raíz del
# repo). Requisito único, solo la primera vez:
#   Settings → Pages → Build and deployment → Source: «GitHub Actions»
#
# A partir de ahí: cada versión nueva (git push) queda online en 1-2 min.
# =====================================================================
name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir el sitio (raíz del repo)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
