<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#1f4f9a" />
  <link rel="icon" href="./assets/icons/icon-192.png" />
  <title>Página no encontrada · Dr.Coach!</title>
  <style>
    /* Dr.Coach! 404 — autocontenida, sin dependencias.
       Colores de marca: navy #1f4f9a / papel #f5f4f0. */
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f4f0;
      color: #1c2430;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 460px;
      background: #ffffff;
      border: 1px solid rgba(31, 79, 154, .14);
      border-radius: 18px;
      padding: 40px 32px 32px;
      box-shadow: 0 18px 50px rgba(28, 36, 48, .10);
    }
    .card img { width: 132px; height: auto; margin: 0 auto 14px; display: block; }
    .code {
      font-size: 64px;
      font-weight: 800;
      letter-spacing: .04em;
      color: #1f4f9a;
      line-height: 1;
    }
    h1 { font-size: 20px; margin: 10px 0 8px; }
    p  { font-size: 14.5px; line-height: 1.6; color: #5a6472; }
    .btn {
      display: inline-block;
      margin-top: 22px;
      padding: 12px 26px;
      border-radius: 12px;
      background: #1f4f9a;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(31, 79, 154, .30); }
    .count { margin-top: 14px; font-size: 12.5px; color: #8a93a1; }
    .count b { color: #1f4f9a; }
    @media (prefers-color-scheme: dark) {
      body { background: #12161d; color: #e8ebf0; }
      .card { background: #1a2029; border-color: rgba(122, 165, 224, .18); box-shadow: 0 18px 50px rgba(0,0,0,.45); }
      h1 { color: #e8ebf0; }
      p, .count { color: #9aa4b2; }
      .btn { background: #3a6db8; }
    }
  </style>
</head>
<body>
  <main class="card">
    <img src="./assets/img/drcoach-logo.webp" alt="Dr.Coach!" />
    <div class="code">404</div>
    <h1>Esta página no existe</h1>
    <p>La ruta que buscas no está en Dr.Coach! (quizá el enlace cambió o se escribió mal). Tu progreso está a salvo: vive en tu navegador.</p>
    <a class="btn" href="./index.html">Volver a Dr.Coach!</a>
    <p class="count">Te llevo al inicio en <b id="s">5</b> s…</p>
  </main>
  <script>
    // Redirección automática a la app (ruta relativa: funciona en la raíz
    // de GitHub Pages y en cualquier subcarpeta).
    let n = 5;
    const el = document.getElementById('s');
    const t = setInterval(() => {
      n -= 1;
      if (el) el.textContent = String(n);
      if (n <= 0) { clearInterval(t); location.replace('./index.html'); }
    }, 1000);
  </script>
</body>
</html>
